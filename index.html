/* Layout: bright Iranian storefront. White header with a big search, banner slider + side promos, colored category circles,
   orange flash-deal band, cartridge finder and repair booking as the two signature tools. Deliberately light-only. */
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --soft:#EEF2F9; --text:#141A2C; --muted:#667085; --line:#E3E8F0;
  --blue:#1E5EFF; --blue-d:#1546CC; --blue-soft:#E9F0FF;
  --orange:#FF6B2C; --orange-d:#E5531A; --orange-soft:#FFF1EA;
  --yellow:#FFC233; --teal:#0E9384; --teal-soft:#E4F6F3; --navy:#0F1A47;
  --green:#12B76A; --green-soft:#E7F8EF; --red:#E5383B; --red-soft:#FDECEC; --warn:#DC7A00; --warn-soft:#FFF4E2;
  --tile:#F2F5FA; --a-body:#DCE3EE; --a-body2:#C3CDDB; --a-dark:#27324A; --a-line:#A8B3C5;
  --scrim:rgba(15,26,71,.45);
  --sh1:0 1px 2px rgba(20,26,44,.05); --sh2:0 12px 32px rgba(20,26,44,.10);
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{line-height:1.5;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:16px}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}.ic.xl{width:36px;height:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding-inline:20px;border-radius:12px;font-weight:700;font-size:14.5px;transition:background .15s,transform .1s,box-shadow .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(30,94,255,.25)}
.btn-primary:hover{background:var(--blue-d)}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(255,107,44,.28)}
.btn-orange:hover{background:var(--orange-d)}
.btn-white{background:#fff;color:var(--text)}
.btn-white:hover{background:var(--soft)}
.btn-ghost{border:1.5px solid var(--line);background:var(--card)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{height:36px;padding-inline:14px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;position:relative;color:var(--text)}
.iconbtn:hover{background:var(--soft)}
.badge-count{position:absolute;top:2px;inset-inline-end:0;min-width:19px;height:19px;padding-inline:5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1;border:2px solid #fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:#0A8A50}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}.pill.or{background:var(--orange-soft);color:var(--orange-d)}.pill.teal{background:var(--teal-soft);color:var(--teal)}.pill.grey{background:var(--soft);color:var(--muted)}
.field{display:grid;gap:6px;min-width:0}
.field label,.flabel{font-size:13.5px;font-weight:700}
.input,select.input,textarea.input{width:100%;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding-inline:14px;outline:0;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding-block:10px;line-height:1.8;resize:vertical}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.input.err{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted)}
.errtxt{font-size:12.5px;color:var(--red);font-weight:600}
.errtxt:empty{display:none}

/* demo bar */
.backbar{background:var(--navy);color:#fff}
.backbar .wrap{display:flex;align-items:center;gap:12px;min-height:40px;flex-wrap:wrap;padding-block:4px}
.backbar .lbl{font-size:12px;opacity:.7}
.backbar nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.backbar nav button{font-size:13px;font-weight:700;padding:5px 14px;border-radius:8px;color:rgba(255,255,255,.75)}
.backbar nav button[aria-current="true"]{background:#fff;color:var(--navy)}
.backbar nav button:hover{color:#fff}

.backbar .home{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:700;color:#fff}
.sign{font-size:12.5px;color:var(--muted)}
.sign b{color:var(--text);font-weight:800}
.backbar .sign{color:rgba(255,255,255,.65)}.backbar .sign b{color:#fff}
.flinks{display:flex;gap:14px;flex-wrap:wrap}
.flinks button{color:var(--muted);font-size:12.5px;font-weight:600}
.flinks button:hover{color:var(--blue)}
.mbnav{display:none}

/* header */
.topbanner{background:var(--orange);color:#fff;text-align:center;font-size:13.5px;font-weight:700;padding:7px 16px}
.topbanner b{background:#fff;color:var(--orange-d);padding:1px 8px;border-radius:6px;margin-inline:4px}
header.site{background:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;gap:18px;min-height:76px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.logo .wm{display:grid;line-height:1.25;text-align:start}
.logo .wm b{font-weight:900;font-size:21px;letter-spacing:-.3px}
.logo .wm span{font-size:11px;color:var(--muted);font-weight:600}
.search{flex:1;position:relative;max-width:620px}
.search .input{height:48px;padding-inline-start:46px;background:var(--soft);border-color:transparent}
.search .input:focus{background:#fff}
.search>.ic{position:absolute;inset-inline-start:15px;top:14px;color:var(--muted)}
.sugg{position:absolute;top:54px;inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);overflow:hidden;z-index:40}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;text-align:start}
.sugg button:hover,.sugg button.on{background:var(--soft)}
.sugg .th{width:46px;height:36px;border-radius:8px;background:var(--tile);flex:none;overflow:hidden}
.sugg .th svg{width:100%;height:100%}
.sugg .t{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .p{font-size:12.5px;color:var(--muted)}
.hacts{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.hacts .btn{height:42px}
.catnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-height:48px;align-items:center}
.catnav button{white-space:nowrap;padding:6px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#3B4458;display:flex;gap:6px;align-items:center}
.catnav button:hover,.catnav button.on{color:var(--blue);background:var(--blue-soft)}
.catnav .hot{color:var(--orange-d)}
.catnav .svc{color:var(--teal)}
.catnav .sep{width:1px;height:22px;background:var(--line);flex:none;margin-inline:6px}

/* hero */
.hero{padding-block:20px 6px}
.hero-grid{display:grid;grid-template-columns:2.1fr 1fr;gap:16px}
.slider{position:relative;border-radius:22px;overflow:hidden;min-height:330px}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:34px 40px;gap:20px;color:#fff;opacity:0;transition:opacity .5s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .tx{display:grid;gap:12px;justify-items:start;z-index:1}
.slide .kick{font-size:13px;font-weight:800;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:999px}
.slide h2{font-size:clamp(24px,3.2vw,38px);font-weight:900;line-height:1.45}
.slide p{opacity:.9;max-width:38ch}
.slide .art{justify-self:center;width:min(100%,330px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.slide .art svg{width:100%;height:auto;display:block}
.slide .blob{position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-start:-90px;bottom:-200px}
.slide .blob2{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-start:34%;top:-90px}
.s1{background:var(--blue)}.s2{background:var(--orange)}.s3{background:var(--teal)}
.dots{position:absolute;bottom:16px;inset-inline-end:40px;display:flex;gap:6px;z-index:2}
.dots button{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.5);transition:width .25s}
.dots button.on{width:26px;background:#fff}
.side{display:grid;gap:16px}
.promo{border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:start;position:relative;overflow:hidden;min-height:157px;transition:transform .15s}
.promo:hover{transform:translateY(-2px)}
.promo b{font-size:18px;font-weight:900;line-height:1.5;max-width:13ch;z-index:1}
.promo span{font-size:13px;font-weight:600;z-index:1;display:flex;align-items:center;gap:4px}
.promo .pa{position:absolute;inset-inline-end:-6px;bottom:-8px;width:150px}
.promo .pa svg{width:100%;height:auto}
.p1{background:#FFE9A8;color:#5A3D00}.p2{background:var(--blue-soft);color:var(--blue-d)}

/* category circles */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.catc{display:grid;justify-items:center;gap:8px;padding:6px;text-align:center}
.catc .circ{width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;transition:transform .2s}
.catc:hover .circ{transform:scale(1.05)}
.catc .circ svg{width:84%;height:auto}
.catc b{font-size:14px;font-weight:700}
.catc span{font-size:12px;color:var(--muted);margin-top:-8px}

.sec{padding-block:22px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:21px;font-weight:900}
.sec-h .sub{color:var(--muted);font-size:13.5px}
.sec-h .end{margin-inline-start:auto}
.linkbtn{color:var(--blue);font-weight:700;font-size:14px;display:inline-flex;gap:4px;align-items:center}

/* flash deals */
.deals{background:var(--orange);border-radius:22px;padding:18px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:stretch}
.deals-intro{color:#fff;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px}
.deals-intro h2{font-size:26px;font-weight:900;line-height:1.4}
.cd{display:flex;gap:5px;direction:ltr;justify-content:flex-end}
.cd span{background:#fff;color:var(--orange-d);border-radius:8px;min-width:38px;text-align:center;font-weight:900;padding:3px 6px;font-size:16px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,214px);gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}

/* finder band */
.finder{background:#fff;border-radius:22px;padding:26px;display:grid;grid-template-columns:1fr 1.15fr;gap:26px;align-items:start;box-shadow:var(--sh1)}
.finder .ft{display:grid;gap:12px}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;padding:4px 12px;border-radius:999px;width:max-content}
.tag.b{color:var(--blue);background:var(--blue-soft)}.tag.t{color:var(--teal);background:var(--teal-soft)}.tag.o{color:var(--orange-d);background:var(--orange-soft)}
.finder h2{font-size:24px;font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;background:#fff;font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.finder-res{display:grid;gap:8px;max-height:300px;overflow:auto;align-content:start}
.fres{display:flex;gap:10px;align-items:center;padding:8px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.fres .th{width:62px;height:46px;border-radius:10px;background:var(--tile);flex:none;overflow:hidden}
.fres .th svg{width:100%;height:100%}
.fres .t{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.6;text-align:start}
.fres .t small{display:block;font-weight:500;color:var(--muted)}
.empty-note{font-size:13.5px;color:var(--muted);padding:16px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;display:grid;gap:8px;justify-items:center}

/* repair band */
.rband{background:var(--navy);color:#fff;border-radius:22px;padding:30px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.rband h2{font-size:28px;font-weight:900;line-height:1.45}
.rband p{opacity:.8;max-width:46ch}
.rband .steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rband .steps4 div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;display:grid;gap:4px;font-size:12.5px}
.rband .steps4 b{font-size:14px}
.rband .steps4 .ic{color:var(--yellow)}
.rband .row{display:flex;gap:10px;flex-wrap:wrap}
.rband .art{max-width:340px;justify-self:center;width:100%}
.rband .art svg{width:100%;height:auto}

/* catalog */
.catalog{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.filters{background:#fff;border-radius:18px;padding:18px;display:grid;gap:18px;position:sticky;top:150px;box-shadow:var(--sh1)}
.filters h4{font-size:14.5px;margin-bottom:6px}
.filters .opt{display:flex;align-items:center;gap:8px;font-size:14px;padding-block:3px;cursor:pointer}
.filters .opt input{accent-color:var(--blue);width:17px;height:17px}
.filters .opt .c{margin-inline-start:auto;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--blue)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:var(--sh1)}
.toolbar .lbl{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.toolbar .sorts{display:flex;gap:2px;flex-wrap:wrap}
.toolbar .sorts button{font-size:13px;padding:5px 10px;border-radius:8px;color:var(--muted);font-weight:600}
.toolbar .sorts button.on{color:var(--blue);font-weight:800}
.toolbar .cnt{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.mfilter{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

.card{background:#fff;border-radius:18px;display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s;min-width:0;box-shadow:var(--sh1)}
.card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.card-art{display:block;width:100%;aspect-ratio:1/0.82;position:relative;overflow:hidden;padding:14px 14px 0}
.card-art svg{width:100%;height:100%;transition:transform .3s}
.card:hover .card-art svg{transform:scale(1.05)}
.card .oos{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.6);font-weight:800;font-size:14px;color:var(--muted)}
.card .wish{position:absolute;top:10px;inset-inline-start:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#98A2B3;z-index:2;box-shadow:var(--sh1)}
.card .wish:hover{color:var(--red)}
.card .wish.on{color:var(--red)}
.card .wish.on .ic{fill:currentColor}
.card .ribbon{position:absolute;top:12px;inset-inline-end:12px;font-size:11px;font-weight:800;padding:1px 8px;border-radius:6px;z-index:2}
.ribbon.new{background:var(--teal-soft);color:var(--teal)}
.ribbon.orig{background:var(--blue-soft);color:var(--blue)}
.card-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-weight:600;font-size:14px;line-height:1.75;min-height:3.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 button{text-align:start}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stock-low{color:var(--red);font-weight:700}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.price{display:grid;justify-items:end;line-height:1.4;margin-inline-start:auto}
.price .row{display:flex;gap:6px;align-items:center}
.price s{font-size:12.5px;color:#98A2B3}
.disc{background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:0 7px;border-radius:999px;line-height:1.7}
.price b{font-size:17px;font-weight:800}
.price b small{font-size:11px;font-weight:500;color:var(--muted)}
.card .add{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;transition:all .15s}
.card .add:hover{background:var(--blue);color:#fff}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-weight:700;font-size:12.5px}
.stars .ic{fill:var(--yellow);stroke:var(--yellow);width:14px;height:14px}

.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trust div{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh1)}
.trust .ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:12.5px;color:var(--muted)}

.bands{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.band{border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.band h3{font-size:20px;font-weight:900}
.band p{max-width:48ch;color:#3B4458}
.band.adv{background:var(--blue-soft)}.band.adv .ic.xl{color:var(--blue)}
.band.b2b{background:#FFE9A8}.band.b2b .ic.xl{color:#8A5A00}

footer.site{background:#fff;margin-top:34px}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:24px;padding-block:34px}
.fgrid h4{font-size:15px;margin-bottom:10px}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.fgrid p{font-size:14px;color:var(--muted);max-width:42ch}
.seals{display:flex;gap:10px;margin-top:14px}
.seal{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);padding:6px}
.fbot{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.fbot .wrap{display:flex;gap:12px;padding-block:14px;flex-wrap:wrap;justify-content:space-between}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
@keyframes side{from{transform:translateX(-30px);opacity:0}}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--bg);z-index:61;display:flex;flex-direction:column;animation:side .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:17px}
.drawer-h .x{margin-inline-start:auto}
.drawer-b{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.drawer-f{padding:14px 16px;background:#fff;border-top:1px solid var(--line);display:grid;gap:10px}
.modal{position:fixed;inset:0;z-index:61;display:grid;place-items:center;padding:16px;overflow:auto}
.modal-box{background:#fff;border-radius:22px;width:min(1020px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative;animation:up .22s;box-shadow:var(--sh2)}
.modal-box.sm{width:min(560px,100%)}
.modal-x{position:sticky;top:12px;float:inline-end;margin:12px;z-index:3;background:var(--soft)}
.pd{display:grid;grid-template-columns:1fr 1.05fr;gap:26px;padding:24px}
.pd-art{background:var(--tile);border-radius:18px;aspect-ratio:4/3;overflow:hidden;max-width:100%;padding:18px}
.pd-art svg{width:100%;height:100%}
.pd-thumbs{display:flex;gap:8px;margin-top:10px}
.pd-thumbs div{width:68px;height:52px;border-radius:10px;background:var(--tile);overflow:hidden;opacity:.6;padding:4px}
.pd-thumbs div:first-child{opacity:1;outline:2px solid var(--blue)}
.pd-thumbs svg{width:100%;height:100%}
.pd-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.pd-info h2{font-size:21px;line-height:1.7;font-weight:800}
.pd-en{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.pd-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.buybox{background:var(--bg);border-radius:18px;padding:16px;display:grid;gap:12px}
.buybox .bp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.buybox .bp b{font-size:25px;font-weight:900}
.buybox .bp s{color:#98A2B3}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;height:44px;background:#fff}
.qty button{width:38px;height:100%;display:grid;place-items:center;color:var(--blue)}
.qty span{min-width:28px;text-align:center;font-weight:800}
.inst{display:flex;gap:6px;flex-wrap:wrap}
.inst button{flex:1;min-width:84px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;font-size:12px;text-align:center;line-height:1.5;background:#fff}
.inst button.on{border-color:var(--blue);background:var(--blue-soft)}
.inst button b{display:block;font-size:13.5px}
.spec{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13.5px}
.spec td{padding:8px 12px;background:var(--bg);vertical-align:top}
.spec td:first-child{color:var(--muted);width:38%;white-space:nowrap;border-radius:0 10px 10px 0}
.spec td:last-child{border-radius:10px 0 0 10px;font-weight:600}
.pd-sec{padding:0 24px 24px;display:grid;gap:12px}
.pd-sec h3{font-size:16px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}

.citem{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px}
.citem .th{width:78px;height:62px;border-radius:10px;background:var(--tile);flex:none;overflow:hidden;padding:4px}
.citem .th svg{width:100%;height:100%}
.citem .t{flex:1;min-width:0;display:grid;gap:6px}
.citem .t b{font-size:13.5px;line-height:1.6;font-weight:600}
.citem .r{display:flex;align-items:center;gap:8px}
.citem .qty{height:34px}.citem .qty button{width:30px}
.shipbar{background:#fff;border-radius:16px;padding:12px;font-size:13px;display:grid;gap:8px}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.sumrow{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.sumrow.total{font-size:16px;font-weight:900;padding-top:8px;border-top:1.5px dashed var(--line)}
.sumrow .neg{color:var(--red)}
.xsell{background:#fff;border-radius:16px;padding:12px;display:grid;gap:8px;border:1.5px dashed var(--blue)}
.xsell h4{font-size:13.5px;color:var(--blue);display:flex;gap:6px;align-items:center}

.cmpbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);z-index:50;background:var(--navy);color:#fff;border-radius:16px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh2);font-size:13.5px;max-width:calc(100% - 32px)}
.cmptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.cmptable th,.cmptable td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.cmptable th{color:var(--muted);font-weight:600;white-space:nowrap}
.scrollx{overflow-x:auto}

.toastwrap{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;z-index:90;display:grid;gap:8px;max-width:min(380px,calc(100% - 36px))}
.toast{background:var(--navy);color:#fff;border-radius:14px;padding:11px 15px;font-size:13.5px;display:flex;gap:8px;align-items:center;animation:up .2s;box-shadow:var(--sh2);font-weight:600}
.toast .ic{color:var(--yellow)}

/* assistant */
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;z-index:45;height:54px;padding-inline:18px 22px;border-radius:27px;background:var(--blue);color:#fff;display:flex;gap:8px;align-items:center;font-weight:800;box-shadow:0 10px 24px rgba(30,94,255,.35)}
.chat{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;z-index:62;width:min(400px,calc(100% - 36px));height:min(560px,calc(100vh - 120px));background:var(--bg);border-radius:22px;box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;animation:up .2s}
.chat-h{background:var(--blue);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.chat-h b{display:block;font-size:14.5px}.chat-h span{font-size:11.5px;opacity:.8}
.chat-h .iconbtn{color:#fff;margin-inline-start:auto;width:36px;height:36px}
.chat-h .iconbtn:hover{background:rgba(255,255,255,.15)}
.chat-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.85;white-space:pre-wrap}
.msg.me{align-self:flex-start;background:var(--blue);color:#fff;border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:#fff;border-end-end-radius:4px}
.msg .recs{display:grid;gap:6px;margin-top:8px;white-space:normal}
.chat-f{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.chat-q{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}

/* checkout + repair forms */
.steps{display:flex;gap:6px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.steps span{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:700}
.steps span i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;font-style:normal;font-size:12px;border:1.5px solid var(--line)}
.steps span.on{color:var(--text)}.steps span.on i{background:var(--blue);color:#fff;border-color:var(--blue)}
.steps .ln{flex:0 0 28px;height:2px;background:var(--line);border-radius:1px}
.co{display:grid;grid-template-columns:1fr 370px;gap:18px;align-items:start}
.panel{background:#fff;border-radius:20px;padding:22px;display:grid;gap:14px;box-shadow:var(--sh1);min-width:0}
.panel h3{font-size:17px;display:flex;gap:8px;align-items:center}
.panel h3 .n{width:26px;height:26px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:13px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid2 .full{grid-column:1/-1}
.opts{display:grid;gap:8px}
.opts.cols{grid-template-columns:repeat(3,1fr)}
.optc{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.optc:hover{border-color:#B7C6E8}
.optc:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.optc input{accent-color:var(--blue);width:17px;height:17px}
.optc .t{flex:1;font-size:14px;font-weight:700}.optc .t small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.optc .v{font-weight:800;font-size:13.5px}
.optc.dis{opacity:.45;pointer-events:none}
.svc{display:grid;gap:8px;justify-items:start;text-align:start;border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;background:#fff;transition:all .15s;position:relative}
.svc:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.svc input{position:absolute;opacity:0}
.svc .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.svc b{font-size:15px}.svc small{font-size:12.5px;color:var(--muted)}
.probs{display:flex;flex-wrap:wrap;gap:8px}
.probs label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;font-weight:600;background:#fff}
.probs label:has(input:checked){border-color:var(--orange);background:var(--orange-soft);color:var(--orange-d)}
.probs input{position:absolute;opacity:0;width:1px;height:1px}
.probs label:has(input:focus-visible){outline:2.5px solid var(--blue);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.slots label{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer;font-size:12.5px;line-height:1.6;background:#fff}
.slots label b{display:block;font-size:14px}
.slots label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue-d)}
.slots input{position:absolute;opacity:0;width:1px;height:1px}
.slots label:has(input:focus-visible){outline:2.5px solid var(--blue);outline-offset:2px}
.diag{background:var(--orange-soft);border-radius:16px;padding:16px;display:grid;gap:10px}
.diag h4{font-size:15px;display:flex;gap:6px;align-items:center;color:var(--orange-d)}
.diag ul{margin:0;padding-inline-start:20px;font-size:13.5px;display:grid;gap:4px}
.diag .est{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;background:#fff;border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.refill-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.refill-tbl td,.refill-tbl th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.refill-tbl th{font-size:12.5px;color:var(--muted)}
.success{max-width:660px;margin:30px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.success .ok-ic{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.code-box{font-size:24px;font-weight:900;letter-spacing:.06em;background:#fff;border:2px dashed var(--blue);color:var(--blue);padding:8px 22px;border-radius:14px;direction:ltr}
.sms{background:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;font-size:13.5px;text-align:start;max-width:440px;line-height:1.95;box-shadow:var(--sh1)}
.timeline{display:grid;text-align:start;width:100%;background:#fff;border-radius:18px;padding:18px}
.tl{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;inset-inline-start:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl:last-child{padding-bottom:0}.tl:last-child::before{display:none}
.tl i{width:26px;height:26px;border-radius:50%;background:var(--soft);flex:none;display:grid;place-items:center;font-style:normal;z-index:1;font-size:12px;font-weight:700;color:var(--muted)}
.tl.done i{background:var(--green);color:#fff}
.tl.now i{background:var(--blue);color:#fff;box-shadow:0 0 0 5px var(--blue-soft)}
.tl b{display:block;font-size:14px}.tl span{font-size:12.5px;color:var(--muted)}
.gateway{max-width:420px;margin:0 auto;padding:28px;display:grid;gap:14px;text-align:center}
.spin{width:40px;height:40px;border:3.5px solid var(--soft);border-top-color:var(--blue);border-radius:50%;animation:rot 1s linear infinite;margin:auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* admin */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 40px)}
.aside{background:#fff;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100vh - 40px);overflow:auto}
.aside .logo{padding:4px 8px 18px}
.aside button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;color:#475467;text-align:start}
.aside button:hover{background:var(--soft);color:var(--text)}
.aside button.on{background:var(--blue);color:#fff}
.aside .cnt{margin-inline-start:auto;font-size:11px;padding:0 7px;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;line-height:1.8}
.amain{padding:24px;display:grid;gap:18px;align-content:start;min-width:0}
.ahead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ahead h1{font-size:23px;font-weight:900}
.ahead p{color:var(--muted);font-size:14px;flex-basis:100%}
.ahead .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border-radius:18px;padding:16px 18px;display:grid;gap:2px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.kpi .ib{position:absolute;inset-inline-end:14px;top:14px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-size:24px;font-weight:900}
.kpi small{font-size:12.5px}
.up{color:#0A8A50}.down{color:var(--red)}
.agrid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.box{background:#fff;border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0;align-content:start;box-shadow:var(--sh1)}
.box h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.box h3 .end{margin-inline-start:auto}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .br{fill:#B9CCFF}
.chart .br.last{fill:var(--blue)}
.lst{display:grid}
.lst>div{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.lst>div:last-child{border-bottom:0}
.lst .th{width:46px;height:36px;border-radius:8px;background:var(--tile);overflow:hidden;flex:none;padding:2px}
.lst .th svg{width:100%;height:100%}
.lst .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{display:grid;font-size:13px;max-height:360px;overflow:auto}
.log div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.log time{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.log .rn{font-weight:800;color:var(--blue);white-space:nowrap;font-size:12px;background:var(--blue-soft);border-radius:6px;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#FAFBFD}
.tbl .th{width:54px;height:42px;border-radius:9px;background:var(--tile);overflow:hidden;padding:3px}
.tbl .th svg{width:100%;height:100%}
.tbl .ttl{max-width:340px;font-weight:600;line-height:1.65}
.tbl .ttl small{display:block;font-weight:500;color:var(--muted)}
.stockin,.costin{width:70px;height:34px;text-align:center;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.costin{width:110px}
.acts{display:flex;gap:2px}
.acts .iconbtn{width:34px;height:34px}
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe span{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 11px;border-radius:10px;background:var(--soft);color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.pipe span i{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:10px}
.pipe span.run{background:var(--blue-soft);color:var(--blue)}
.pipe span.done{background:var(--green-soft);color:#0A8A50}
.pipe span.done i{background:var(--green);border-color:var(--green);color:#fff}
.drafts{display:grid;gap:12px}
.draft{background:#fff;border-radius:18px;display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px;animation:up .25s;box-shadow:var(--sh1)}
.draft .art{background:var(--tile);border-radius:14px;aspect-ratio:4/3;overflow:hidden;max-width:100%;padding:8px}
.draft .art svg{width:100%;height:100%}
.draft .dt{display:grid;gap:8px;min-width:0}
.draft .dt h4{font-size:15.5px;font-weight:800}
.draft .kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.draft .kv b{color:var(--text);font-weight:700}
.draft .seo{border-inline-start:3px solid var(--green);padding-inline-start:10px;font-size:12.5px}
.draft .seo .st{color:var(--blue);font-weight:700}
.draft .seo .sl{color:#0A8A50;font-size:11.5px;direction:ltr;text-align:right}
.draft .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.draft .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* finder */
const normModel = s => enDigits(s).toLowerCase().replace(/hp|laserjet|deskjet|officejet|color|pro|mfp|printer|پرینتر|[\s\-_]/g, '');
function finderResults(q) {
  const qn = normModel(q); if (qn.length < 2) return null;
  const cons = visible().filter(p => ['toner', 'ink', 'parts'].includes(p.cat));
  const direct = cons.filter(p => p.code && normModel(p.code) === qn);
  const viaCompat = cons.filter(p => p.compat.some(c => { const n = normModel(c); return n && (n.includes(qn) || (qn.length >= 4 && qn.includes(n))); }));
  const printers = visible().filter(p => p.cat === 'printer' && normModel(p.titleEn).includes(qn));
  const viaPrinter = printers.flatMap(pr => cons.filter(i => pr.compat.includes(i.code)));
  const order = { toner: 0, ink: 0, parts: 1 };
  return [...new Map([...direct, ...viaCompat, ...viaPrinter].map(p => [p.id, p])).values()].sort((a, b) => order[a.cat] - order[b.cat]);
}

  const p = byId(id); if (!p || p.stock <= 0) return;
  const line = S.cart.find(i => i.id === id);

}

function ruleAdvisor(q) {

  }

  else if (/کم.?هزینه|ارزان/.test(t)) L.sort((a, b) => (+b.tags.includes('کم‌هزینه') - +a.tags.includes('کم‌هزینه')) || finalPrice(a) - finalPrice(b));
  else L.sort((a, b) => b.sold - a.sold);

  return { reply: ids.length ? `${budget ? 'با بودجه‌ی حدود ' + fa(budget / 1e6) + ' میلیون تومان، ' : ''}این ${fa(ids.length)} گزینه بیشترین تطابق را دارند.${tip}` : 'با این مشخصات کالای موجودی پیدا نکردم. بودجه یا کاربری را دقیق‌تر بگویید.', ids };
}

async function animatePipe() { for (let k = 0; k <= PIPE.length; k++) { setPipe(k); await sleep(110); } }
async function importRule() {
  const lines = $('#imp').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) { $('#impstat').textContent = 'حداقل یک کالا بنویسید.'; return; }
  importBusy = true; await animatePipe();
  const made = lines.map(l => { try { return parseLine(l); } catch (e) { return null; } }).filter(Boolean);
  drafts = [...made, ...drafts]; importBusy = false;
  $('#impstat').textContent = `${fa(made.length)} کالا در کمتر از یک ثانیه ساخته شد`;
  renderDrafts();
}
function publishDrafts() {
  const sel = drafts.filter(p => p._sel !== false);
  if (!sel.length) { toast('هیچ پیش‌نویسی انتخاب نشده است', 'x'); return; }
  sel.forEach(p => { delete p._sel; p.createdAt = Date.now(); S.products.unshift(p); });
  drafts = drafts.filter(p => p._sel === false);
  logA('import', `${fa(sel.length)} کالای جدید منتشر شد: ${sel.map(p => p.titleEn.replace(/^HP\s/, '')).slice(0, 3).join('، ')}`);
  if (S.settings.rules.seo) logA('seo', `سئو، نامک و برچسب برای ${fa(sel.length)} کالای جدید ثبت شد`);

}

/* ================= view switching & events ================= */
let currentView = 'shop', pdQty = 1;
function switchView(v) {
  currentView = v; closeOverlay();
  ['shop', 'admin', 'brand'].forEach(k => { $('#view-' + k).hidden = k !== v; });
  const bb = $('#backbar'); bb.hidden = v === 'shop';
  bb.innerHTML = v === 'shop' ? '' : `<div class="wrap"><button class="home" data-view="shop">${ic('home', 'sm')} بازگشت به فروشگاه</button><nav aria-label="بخش‌ها"><button data-view="admin" aria-current="${v === 'admin'}">پنل مدیریت</button><button data-view="brand" aria-current="${v === 'brand'}">هویت برند</button></nav></div>`;
  if (v === 'shop') renderShop(); else if (v === 'admin') renderAdmin(); else renderBrand();
  renderChat(); renderCompareBar(); scrollTo(0, 0);
}
function goShop(page) { shopPage = page; if (currentView !== 'shop') switchView('shop'); else { renderShopMain(); scrollTo(0, 0); } }
function scrollToEl(sel) { setTimeout(() => { const el = $(sel); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }, 30); }
function toCatalog() { if (shopPage !== 'home') { shopPage = 'home'; renderShopMain(); } else renderGrid(); scrollToEl('#catalog'); }
function toHomeSection(sel) { if (currentView !== 'shop') switchView('shop'); if (shopPage !== 'home') { shopPage = 'home'; renderShopMain(); } scrollToEl(sel); }
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('کپی شد', 'copy'); }
  catch (e) { if (fallbackEl) { if (fallbackEl.select) fallbackEl.select(); else { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } toast('متن انتخاب شد؛ با Ctrl+C کپی کنید', 'copy'); }
}
function renderFilterChecks() { $$('[data-fcat]').forEach(c => c.checked = F.cats.has(c.dataset.fcat)); }
const rById = id => S.repairs.find(r => r.id === id);

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-view]'); if (!el) return;
  if (el.dataset.view && !el.dataset.act) { switchView(el.dataset.view); return; }
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'home': closeOverlay(); goShop('home'); break;
    case 'track': goShop('track'); break;
    case 'wishlist': openWish(); break;
    case 'cart': openCart(); break;
    case 'cat': closeOverlay(); F.cats = new Set([el.dataset.cat]); F.q = ''; if ($('#q')) $('#q').value = ''; $$('.catnav [data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === el.dataset.cat)); toCatalog(); renderFilterChecks(); break;
    case 'deals': toHomeSection('#deals'); break;
    case 'dealsall': F.cats.clear(); F.sort = 'disc'; toCatalog(); renderShopMain(); scrollToEl('#catalog'); break;
    case 'finder': closeOverlay(); toHomeSection('#finder'); setTimeout(() => $('#fq')?.focus({ preventScroll: true }), 450); break;
    case 'repair': closeOverlay(); RQ.type = 'repair'; if (el.dataset.model) RQ.model = el.dataset.model; goShop('repair'); break;
    case 'refill': closeOverlay(); RQ.type = 'refill'; if (el.dataset.code && REFILL[el.dataset.code]) RQ.cart = el.dataset.code; goShop('repair'); break;
    case 'b2b': openB2B(); break;
    case 'shopall': F.cats.clear(); F.q = ''; toCatalog(); renderFilterChecks(); break;
    case 'slide': showSlide(+el.dataset.i); break;
    case 'chat': chatOpen = true; openChat(); setTimeout(() => $('#chatin')?.focus(), 50); break;
    case 'chatclose': chatOpen = false; renderChat(); break;
    case 'chatq': askChat(el.dataset.q); break;
    case 'fchip': $('#fq').value = el.dataset.q; $$('.finder .chip').forEach(c => c.classList.toggle('on', c === el)); renderFinder(el.dataset.q); break;
    case 'open': pdQty = 1; if ($('#sugg')) $('#sugg').hidden = true; openProduct(id); break;
    case 'add': addToCart(id); if (el.dataset.reopen) openCart(); break;
    case 'addq': addToCart(id, pdQty); closeOverlay(); openCart(); break;
    case 'pq': { const p = byId(($('[data-act=addq]') || {}).dataset?.id); pdQty = clamp(pdQty + +el.dataset.d, 1, p ? p.stock : 1); $('#pqn').textContent = fa(pdQty); break; }
    case 'inst': payMode = +el.dataset.n; $$('#inst button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'wish': { const i = S.wish.indexOf(id); if (i >= 0) S.wish.splice(i, 1); else { S.wish.push(id); toast('به علاقه‌مندی‌ها اضافه شد', 'heart'); } save(); updateCounts();
      if (el.dataset.reopen === 'wish') openWish(); else if (el.dataset.reopen === 'p') openProduct(id); else $$(`.wish[data-id="${id}"]`).forEach(w => { w.classList.toggle('on', i < 0); w.setAttribute('aria-pressed', String(i < 0)); }); break; }
    case 'cmp': { const i = S.compare.indexOf(id); if (i >= 0) S.compare.splice(i, 1); else { if (S.compare.length >= 3) S.compare.shift(); S.compare.push(id); } save(); renderCompareBar(); openProduct(id); break; }
    case 'cmpopen': openCompare(); break;
    case 'cmpclear': S.compare = []; save(); renderCompareBar(); break;
    case 'notify': if (!S.notify.find(n => n.id === id)) S.notify.push({ id, t: Date.now() }); save(); toast('ثبت شد. وقتی موجود شد، پیامک می‌گیرید.', 'bell'); break;
    case 'fclear': F.cats.clear(); F.max = null; F.inStock = false; F.q = ''; F.sort = 'best'; if ($('#q')) $('#q').value = ''; renderShopMain(); scrollToEl('#catalog'); break;
    case 'mfilter': $('#filters').classList.toggle('open'); break;
    case 'sort': F.sort = el.dataset.sort; $$('.sorts [data-sort]').forEach(b => b.classList.toggle('on', b === el)); renderGrid(); break;
    case 'searchall': F.q = $('#q').value; $('#sugg').hidden = true; toCatalog(); break;
    case 'qty': { const l = S.cart.find(i => i.id === id), p = byId(id); if (!l) break; l.qty = Math.min(l.qty + +el.dataset.d, p.stock); if (l.qty <= 0) S.cart = S.cart.filter(i => i !== l); save(); updateCounts(); openCart(); break; }
    case 'coupon': { const c = enDigits($('#coupon').value).trim().toUpperCase(); if (COUPONS[c]) { S.coupon = c; save(); openCart(); toast('کد تخفیف اعمال شد', 'tag'); } else { $('#couponmsg').textContent = c ? 'این کد معتبر نیست. حروف را بررسی کنید.' : 'کد تخفیف را وارد کنید.'; $('#couponmsg').style.color = 'var(--red)'; } break; }
    case 'checkout': closeOverlay(); goShop('checkout'); break;
    case 'paydone': placeOrder(); break;
    case 'close': closeOverlay(); break;
    case 'closeout': if (e.target === el) closeOverlay(); break;
    case 'rapprove': { const r = rById(id); if (r && r.status === 3) { r.status = 4; if (S.settings.rules.repair) queueSms(r.customer.phone, repairSms(r), `مشتری هزینه‌ی ${r.id} را تأیید کرد؛ تعمیر شروع شد`); save(); renderTrack($('#shopmain'), r.id); toast('هزینه تأیید شد. تعمیر شروع می‌شود.', 'wrench'); } break; }
    case 'rreject': { const r = rById(id); if (r && r.status === 3) { r.status = 5; r.cost = 0; r.desc = (r.desc ? r.desc + ' · ' : '') + 'مشتری تعمیر را تأیید نکرد'; logA('repair', `${r.id}: مشتری انصراف داد؛ دستگاه بدون تعمیر برمی‌گردد`); save(); renderTrack($('#shopmain'), r.id); toast('ثبت شد. دستگاه بدون هزینه برگردانده می‌شود.', 'truck'); } break; }
    /* admin */
    case 'atab': adminTab = el.dataset.tab; if (currentView !== 'admin') switchView('admin'); else renderAdmin(); scrollTo(0, 0); break;
    case 'reset': confirmBox('همه‌ی داده‌ها به حالت نمونه برگردد؟', 'resetyes', '', 'بازگشت به نمونه'); break;
    case 'resetyes': try { localStorage.removeItem(KEY); } catch (er) { } fresh(); save(); drafts = []; closeOverlay(); renderAdmin(); toast('داده‌های نمونه بازگردانده شد', 'refresh'); break;
    case 'imprule': importRule(); break;
    case 'dclear': drafts = []; renderDrafts(); setPipe(-1); $('#impstat').textContent = ''; break;
    case 'dpub': publishDrafts(); break;
    case 'pedit': openEdit(id); break;
    case 'ptoggle': { const p = byId(id); p.status = p.status === 'active' ? 'draft' : 'active'; save(); aProducts($('#amain')); break; }
    case 'pdel': confirmBox('این کالا حذف شود؟', 'pdelyes', id); break;
    case 'pdelyes': S.products = S.products.filter(p => p.id !== id); S.cart = S.cart.filter(i => i.id !== id); save(); closeOverlay(); aProducts($('#amain')); toast('کالا حذف شد', 'trash'); break;
    case 'ofilter': ordFilter = +el.dataset.k; aOrders($('#amain')); break;
    case 'oadv': { const o = S.orders.find(x => x.id === id); if (o && o.status < 4) { o.status++; queueSms(o.customer.phone, smsText(o), `پیامک «${STATUS[o.status]}» برای سفارش ${o.id} در صف ارسال قرار گرفت`); save(); aOrders($('#amain')); toast(`سفارش ${o.id}: ${STATUS[o.status]}`, 'sms'); } break; }
    case 'rfilter': repFilter = +el.dataset.k; aRepairs($('#amain')); break;
    case 'radv': { const r = rById(id); if (r && r.status < 6 && advanceRepair(r)) { renderAdmin(); toast(`${r.id}: ${RSTATUS[r.status]}`, 'wrench'); } break; }
    case 'prpreview': pricePreview(); break;
    case 'runall': runRules(); aAuto($('#amain')); break;
    case 'ffmt': feedFmt = el.dataset.f; aMarket($('#amain')); break;
    case 'copyfeed': copyText(JSON.stringify(feedData(), null, 2), $('#feedpre')); break;
    case 'dlfeed': { const b = new Blob([JSON.stringify(feedData(), null, 2)], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = `nicehp-${feedFmt}-feed.json`; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); break; }
    case 'copyig': copyText($('#igcap').value, $('#igcap')); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') renderSugg(t.value);
  else if (t.id === 'fq') { $$('.finder .chip').forEach(c => c.classList.remove('on')); renderFinder(t.value); }
  else if (t.id === 'fmax') { const v = +t.value; F.max = v >= +t.max ? null : v; $('#fmaxv').textContent = F.max ? 'تا ' + Tt(F.max) : 'همه‌ی قیمت‌ها'; renderGrid(); }
  else if (t.id === 'imp') impText = t.value;
  else if (t.id === 'psearch') { pq = t.value; aProducts($('#amain')); const n = $('#psearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  else if (t.id === 'rq-qty') { readRQ(); renderRepairAside(); }
  else if (t.id === 'rq-desc') RQ.desc = t.value.trim();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fcat) { t.checked ? F.cats.add(t.dataset.fcat) : F.cats.delete(t.dataset.fcat); renderGrid(); }
  else if (t.id === 'fstock') { F.inStock = t.checked; renderGrid(); }
  else if (t.dataset.stock) { const p = byId(t.dataset.stock), was = p.stock; p.stock = Math.max(0, Math.round(+enDigits(t.value) || 0)); if (was <= 0 && p.stock > 0) { const n = S.notify.filter(x => x.id === p.id).length; if (n && S.settings.rules.stock) logA('stock', `${p.titleEn.replace(/^HP\s/, '')} دوباره موجود شد؛ ${fa(n)} پیامک «خبرم کن» ارسال شد`); S.notify = S.notify.filter(x => x.id !== p.id); } runRules(['stock'], true); save(); aProducts($('#amain')); }
  else if (t.dataset.rule) { S.settings.rules[t.dataset.rule] = t.checked; logA(t.dataset.rule, `قانون «${RULES.find(r => r.id === t.dataset.rule).name}» ${t.checked ? 'روشن' : 'خاموش'} شد`); save(); aAuto($('#amain')); }
  else if (t.dataset.dsel) { drafts[+t.dataset.dsel]._sel = t.checked; }
  else if (t.dataset.rtech) { const r = rById(t.dataset.rtech); r.tech = t.value || null; save(); toast(`${r.id} به ${t.value ? TECHS[t.value].fa : 'هیچ‌کس'} سپرده شد`, 'user'); }
  else if (t.dataset.rcost) { const r = rById(t.dataset.rcost); const v = Math.round(+enDigits(t.value) || 0); r.cost = v > 0 ? v : null; save(); }
  else if (t.id === 'igsel') { igId = t.value; aMarket($('#amain')); }
  else if (t.id === 'siteurl') { S.settings.siteUrl = t.value.trim() || DEFAULT_SETTINGS.siteUrl; save(); aMarket($('#amain')); }
  else if (t.id === 'co-city' || t.name === 'ship' || t.name === 'pay') { readCO(); renderCheckout($('#shopmain')); }
  else if (t.name === 'rtype' || t.name === 'rmethod' || t.id === 'rq-city') { readRQ(); renderRepair($('#shopmain')); }
  else if (t.dataset.prob || t.id === 'rq-cart' || t.id === 'rq-device' || t.name === 'rday' || t.name === 'rtime') { readRQ(); renderRepairAside(); }
  else if (t.id === 'csvin' && t.files[0]) { const r = new FileReader(); r.onload = () => { const lines = String(r.result).split(/\r?\n/).map(l => l.split(/[,;\t]/)).filter(c => c[0] && c[0].trim() && !/^(model|name|title|مدل|نام)$/i.test(c[0].trim())).map(c => c[0].replace(/^"|"$/g, '').trim() + (c[1] && +enDigits(c[1]) ? ' | ' + +enDigits(c[1]) : '')); impText = lines.join('\n'); $('#imp').value = impText; $('#impstat').textContent = `${fa(lines.length)} خط از فایل خوانده شد`; }; r.readAsText(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'coform') submitCO();
  else if (f.id === 'rqform') submitRQ();
  else if (f.id === 'trackf') renderTrack($('#shopmain'), $('#trackq').value);
  else if (f.id === 'chatf') { const v = $('#chatin').value; $('#chatin').value = ''; askChat(v); }
  else if (f.id === 'b2bf') {
    const org = $('#b-org').value.trim(), phone = enDigits($('#b-phone').value.trim()), items = $('#b-items').value.trim();
    if (!org || !/^0\d{9,10}$/.test(phone) || !items) { $('#b-err').textContent = 'نام سازمان، شماره‌ی تماس (با صفر اول) و اقلام را کامل کنید.'; return; }
    S.leads.unshift({ t: Date.now(), org, phone, items }); logA('b2b', `درخواست پیش‌فاکتور از «${org}» ثبت شد`); save(); closeOverlay(); toast('درخواست ثبت شد. پیش‌فاکتور به‌زودی ارسال می‌شود.', 'building');
  }
  else if (f.id === 'editf') {
    const p = byId(f.dataset.id); p.titleFa = $('#ed-t').value.trim() || p.titleFa; p.priceUsd = Math.max(1, +enDigits($('#ed-u').value) || p.priceUsd); p.discount = clamp(Math.round(+enDigits($('#ed-d').value) || 0), 0, 60); p.stock = Math.max(0, Math.round(+enDigits($('#ed-s').value) || 0)); p.desc = $('#ed-desc').value.trim() || p.desc; p.price = basePrice(p);
    save(); closeOverlay(); aProducts($('#amain')); toast('ذخیره شد', 'check');
  }
  else if (f.id === 'pricef') { S.settings = readPricing(); recompute(true); runRules(['feed'], true); save(); toast('قیمت همه‌ی کالاها به‌روز شد', 'dollar'); aPricing($('#amain')); pricePreview(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeOverlay(); else if (chatOpen) { chatOpen = false; renderChat(); } else if ($('#sugg') && !$('#sugg').hidden) $('#sugg').hidden = true; }
  if (e.target.id === 'q') {
    const items = $$('#sugg button');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); suggIdx = clamp(suggIdx + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1); items.forEach((b, i) => b.classList.toggle('on', i === suggIdx)); }
    if (e.key === 'Enter') { e.preventDefault(); if (suggIdx >= 0 && items[suggIdx]) items[suggIdx].click(); else { F.q = e.target.value; $('#sugg').hidden = true; toCatalog(); } }
  }
});
document.addEventListener('focusout', e => { if (e.target.id === 'q') setTimeout(() => { const s = $('#sugg'); if (s && !s.contains(document.activeElement)) s.hidden = true; }, 150); });

/* ================= boot ================= */
(function boot() {
  const loaded = load();
  if (loaded && loaded.products && loaded.products.length) { S = loaded; S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...S.settings, rules: { ...DEFAULT_SETTINGS.rules, ...(S.settings || {}).rules } }; ['log', 'cart', 'wish', 'compare', 'notify', 'leads', 'smsQueue', 'orders', 'repairs'].forEach(k => S[k] = S[k] || []); }
  else { fresh(); save(); }
  switchView('shop');
})();

console.log('%cنایس اچ‌پی · Design & Development: Kiarash Ahmadi', 'color:#1E5EFF;font-weight:bold');
</script>
